[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofloop"
version = "0.1.0"
description = "A small, auditable control loop for verifiable agent tasks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yanrong Xiao"}]
keywords = ["agents", "harness", "verification", "automation", "llm"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/IreneXiaooo/proofloop"
Issues = "https://github.com/IreneXiaooo/proofloop/issues"

[project.scripts]
proofloop = "proofloop.cli:main"

[tool.setuptools.packages.find]
include = ["proofloop*"]
