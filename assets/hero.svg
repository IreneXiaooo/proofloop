<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<circle cx="1040" cy="45" r="210" fill="#68e0cf" opacity=".035"/>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="54" y="46" width="220" height="28" rx="14" fill="#20364a"/><text x="71" y="65" fill="#9debdc" font-size="12" letter-spacing="2">VERIFIABLE AGENT WORK</text>
<text x="54" y="159" font-size="72" font-weight="700" fill="#f0f6fc" letter-spacing="-3">ProofLoop<tspan fill="#68e0cf">.</tspan></text>
<text x="57" y="213" font-size="26" fill="#e0ebf7">Your agent proposes.</text><text x="57" y="249" font-size="26" fill="#68e0cf">Your checks decide.</text>
