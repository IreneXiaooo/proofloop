<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">ProofLoop</title><desc id="desc">Your agent proposes. Your checks decide. A local control loop for verifiable agent work.</desc>
